[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-minimal"
version = "0.1.0"
description = "Small, tested DeepSeek mechanism labs; no pretrained weights required"
requires-python = ">=3.12"
dependencies = ["torch>=2.7", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["deepseek_minimal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
